[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meducation-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]==3.3.6",
  "SQLAlchemy==2.1.4",
  "alembic==1.20.0",
  "Authlib==1.8.0",
  "joserfc==1.7.5",
  "cryptography==50.0.2",
  "httpx2==2.13.1",
]

[project.scripts]
meducation-db = "meducation_api.db.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pip-tools>=7.4,<8",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"meducation_api.migrations" = ["*.sql"]
"meducation_api.content_policy" = ["*.mjs", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: integration tests requiring an explicitly isolated PG17 test database"]

[tool.mypy]
python_version = "3.14"
strict = true
