name: Checks

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '.agents/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '.agents/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-dev.lock
          .venv/bin/python -m pip install --no-deps -e backend
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:content-policy
      - run: npm run lint
      - run: npm run format:check
      - name: Check Python style and types
        run: |
          .venv/bin/ruff check backend scripts
          .venv/bin/mypy backend/src
      - run: npm run typecheck
      - run: npm run validate:content -- tests/fixtures/question-bank.json tests/fixtures/empty-flashcard-bank.json
      - run: npm run test:ci
      - name: Test backend against PostgreSQL
        run: .venv/bin/python scripts/testing/test-postgres-content.py
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:admin
      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-traces
          path: |
            test-results/
            test-results-admin/
          retention-days: 3
          if-no-files-found: ignore
