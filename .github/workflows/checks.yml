name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-dev.lock
          .venv/bin/python -m pip install --no-deps -e backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:content-policy
      - name: Check Python style and types
        run: |
          .venv/bin/ruff check backend scripts
          .venv/bin/mypy backend/src
      - name: Test backend
        run: .venv/bin/python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:architecture
      - run: npm run test:ci
      - run: npm run validate:content -- tests/fixtures/question-bank.json tests/fixtures/empty-flashcard-bank.json
      - run: npm run typecheck
      - run: npm run build:learner
      - name: Build the optional local admin entry
        run: npm run build:admin

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-dev.lock
          .venv/bin/python -m pip install --no-deps -e backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:content-policy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:admin
      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-traces
          path: |
            test-results/
            test-results-admin/
          retention-days: 7
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-dev.lock
          .venv/bin/python -m pip install --no-deps -e backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:content-policy
      - run: npm run test:containers
