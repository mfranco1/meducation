pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Never log auth callback codes/state, cookies or request bodies.
    log_format safe_access '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout safe_access;
    server_tokens off;
    sendfile on;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker's DNS updates the API address after recreation. The shared zone
    # and resolve flag also let static serving start while the API is absent.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream content_api {
        zone content_api 64k;
        server api:8000 resolve;
    }

    server {
        listen 8080;
        root /opt/meducation/html;
        index index.html;

        location = /health/frontend {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"live"}';
        }
        location = /health/live {
            include /etc/nginx/meducation-proxy.conf;
        }
        location = /health/ready {
            include /etc/nginx/meducation-proxy.conf;
        }
        location = /api {
            include /etc/nginx/meducation-proxy.conf;
        }
        # Authoring limits match the API byte gate; no compression expansion allowed.
        location ^~ /api/admin/ {
            client_max_body_size 64m;
            proxy_request_buffering off;
            proxy_read_timeout 155s;
            proxy_send_timeout 35s;
            include /etc/nginx/meducation-proxy.conf;
        }
        location ^~ /api/ {
            include /etc/nginx/meducation-proxy.conf;
        }
        location = /admin.html {
            return 404;
        }
        location ~ /\. {
            return 404;
        }
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ \.[^/]+$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
