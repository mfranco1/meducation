# Static page headers. Included in every static location because a location's
# own add_header drops inherited ones. Emotion (MUI) injects style elements, and
# KaTeX CSS embeds a data: font. Add approved VITE_CONTENT_IMAGE_ORIGINS to img-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
